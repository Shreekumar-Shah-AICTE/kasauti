name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The same gate the builder runs locally: typecheck, lint with zero warnings,
# format check, tests at 100% coverage, and a production build.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      # Reproducible install from the committed lockfile; fails if it drifts from package.json.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify
        run: npm run verify
