name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The same gate the builder runs locally: typecheck, lint with zero warnings,
# format check, tests at 100% coverage, and a production build.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `npm ci` is not used: package-lock.json is intentionally not committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify
        run: npm run verify
